<style>
*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}
@media(max-width:767px){
html{font-size:16px}.customer-dashboard-content{width:100%;padding:20px 16px 40px}
.customer-welcome-section{padding:22px 18px}.customer-welcome-content{display:flex;align-items:stretch;flex-direction:column;gap:20px}
.customer-welcome-title{font-size:29px;line-height:1.2}.customer-welcome-description{font-size:15px;line-height:1.6}
.customer-welcome-actions,.customer-primary-action{width:100%}.customer-primary-action{min-height:48px;justify-content:center}
.customer-summary-grid{display:grid;grid-template-columns:1fr;gap:12px}.customer-summary-card{width:100%;min-width:0;padding:18px}
.customer-dashboard-grid{display:grid;grid-template-columns:1fr;gap:16px}.customer-dashboard-column,.customer-dashboard-side-column{display:grid;grid-template-columns:1fr;width:100%;min-width:0;gap:16px}
.customer-dashboard-card{width:100%;min-width:0;padding:18px 15px}.customer-card-header{display:flex;align-items:flex-start;flex-direction:column;gap:12px}
.customer-card-action-link{width:100%;min-height:44px;justify-content:center}
.customer-orders-list,.customer-results-list,.customer-notifications-list,.customer-dashboard-receipts{display:grid;grid-template-columns:1fr;gap:10px}
.customer-orders-list>*,.customer-results-list>*,.customer-notifications-list>*,.customer-dashboard-receipts>*{width:100%;min-width:0}
.customer-quick-actions-list{display:grid;grid-template-columns:1fr}.customer-quick-action{width:100%;min-width:0}
.customer-donor-feature,.customer-dashboard-support,.customer-support-copy{display:flex;align-items:flex-start;flex-direction:column;gap:16px}
.customer-donor-feature-action,.customer-support-action{width:100%;min-height:46px;justify-content:center}
.customer-dashboard-empty{padding:24px 16px}.customer-dashboard-loading{align-items:flex-start}
}
</style>
