<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#24467f"><title>Connecting Portal | screenings4u</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7fb;font-family:Arial,Helvetica,sans-serif;color:#17304f}.card{width:min(92vw,460px);padding:34px;background:#fff;border:1px solid #dce4ee;border-radius:16px;box-shadow:0 18px 45px rgba(23,61,120,.1);text-align:center}.logo{width:220px;max-width:75%;margin:0 auto 24px}.spin{width:34px;height:34px;margin:20px auto;border:3px solid #dce4ee;border-top-color:#ff6b00;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}h1{font-size:24px;margin:0 0 8px;color:#24467f}p{font-size:13px;line-height:1.6;color:#68778c;margin:0}.error{color:#b42318}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/brand-system.css?v=20260918-brand-repair-v2">
</head><body><main class="card"><img class="logo" src="images/logo2.png" alt="screenings4u"><h1>Connecting your portal</h1><p id="message">Verifying your secure C/TPA access…</p><div class="spin" id="spinner"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js?v=20260925-secure-handoff"></script>
<script>
(async()=>{
 const message=document.getElementById('message'),spinner=document.getElementById('spinner');
 const q=new URLSearchParams(location.search),code=(q.get('code')||'').trim();
 try{
   if(!code)throw new Error('The secure portal handoff code is missing.');
   const client=window.getScreenings4uSupabase();
   const {data:exchange,error:exchangeError}=await client.functions.invoke('portal-session-handoff',{body:{action:'redeem',code}});
   if(exchangeError||exchange?.error||!exchange?.token_hash)throw new Error(exchange?.error||exchangeError?.message||'The secure portal handoff could not be redeemed.');
   const verified=await client.auth.verifyOtp({token_hash:exchange.token_hash,type:'email'});
   if(verified.error||!verified.data?.session)throw verified.error||new Error('The portal session could not be established.');
   const surface=String(exchange.target_surface||'').toLowerCase();
   const portal=String(exchange.target_portal||'').toLowerCase();
   const context=await client.functions.invoke('workforce-session-context',{body:{requested_portal:portal.startsWith('ctpa')?'ctpa':portal,requested_surface:surface,surface,portal_code:portal}});
   if(context.error)throw context.error;
   if(context.data?.error||context.data?.has_access===false)throw new Error(context.data?.error||'This account is not authorized for this portal.');
   if(context.data?.membership?.id)sessionStorage.setItem('s4u_workspace_membership',context.data.membership.id);
   const next=String(exchange.next_path||'/ctpa/dashboard.html');
   const safeNext=next.startsWith('/')&&!next.startsWith('//')?next:'/ctpa/dashboard.html';
   history.replaceState(null,'',location.pathname);
   location.replace(safeNext);
 }catch(e){spinner.hidden=true;message.className='error';message.textContent=e?.message||'Unable to complete the portal handoff. Please sign in again.';}
})();
</script></body></html>
