<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#24467f"><link rel="icon" href="images/fav.png"><title>Management Portal Selector | screenings4u</title><style>
:root{--blue:#24467f;--deep:#17335f;--orange:#ff6b00;--bg:#f4f7fb;--line:#d9e3f0;--muted:#667892;--ink:#1d2d45}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}.top{height:78px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 36px}.top img{width:180px;max-height:48px;object-fit:contain}.user{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--muted)}.signout{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;font-weight:800;color:var(--deep);cursor:pointer}.wrap{width:min(1180px,calc(100% - 40px));margin:42px auto}.eyebrow{color:var(--orange);font-size:11px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.head{display:flex;justify-content:space-between;gap:30px;align-items:end;margin-bottom:24px}.head h1{font-size:34px;letter-spacing:-.04em;color:var(--deep);margin:8px 0 8px}.head p{margin:0;color:var(--muted);font-size:13px;line-height:1.6;max-width:720px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{display:flex;flex-direction:column;min-height:210px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:22px;box-shadow:0 8px 24px rgba(23,51,95,.06)}.card h2{margin:0 0 7px;font-size:18px;color:var(--deep)}.card p{margin:0;color:var(--muted);font-size:12px;line-height:1.65}.code{display:inline-flex;width:max-content;margin-bottom:17px;padding:5px 8px;border-radius:999px;background:#eef4fb;color:var(--blue);font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.card button{margin-top:auto;height:43px;border:1px solid var(--orange);border-radius:8px;background:var(--orange);color:#fff;font-weight:900;cursor:pointer}.card button:hover{background:#df5d00}.card button:disabled{opacity:.55;cursor:wait}.status{margin-top:18px;padding:13px 15px;border-radius:9px;background:#fff;border:1px solid var(--line);color:var(--muted);font-size:12px}.error{color:#b42318;border-color:#f4c7c3;background:#fff7f6}.empty{grid-column:1/-1;background:#fff;border:1px solid var(--line);border-radius:15px;padding:30px;text-align:center;color:var(--muted)}@media(max-width:920px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.top{padding:0 20px}}@media(max-width:620px){.grid{grid-template-columns:1fr}.wrap{width:min(100% - 24px,1180px);margin-top:24px}.head{display:block}.top{height:68px}.top img{width:145px}.user span{display:none}}
</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"></head><body><header class="top"><img src="images/logo.png" alt="screenings4u"><div class="user"><span id="identity">Signed in</span><button class="signout" id="signout" type="button">Sign Out</button></div></header><main class="wrap"><div class="head"><div><div class="eyebrow">Secure management access</div><h1>Select a management portal</h1><p>Your account only shows portals you are authorized to enter. Every portal entry is issued from this selector and expires if it is not used promptly.</p></div></div><section class="grid" id="portalGrid"><div class="empty">Loading your authorized portals…</div></section><div id="status" class="status" hidden></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script>
(async()=>{const grid=document.getElementById('portalGrid'),status=document.getElementById('status'),id=document.getElementById('identity');const client=window.getScreenings4uSupabase?window.getScreenings4uSupabase():window.supabaseClient;function msg(t,e=false){status.hidden=!t;status.textContent=t||'';status.className='status'+(e?' error':'')}try{const {data:{session}}=await client.auth.getSession();if(!session){location.replace('admin-login.html');return}id.textContent=session.user?.email||'Signed in';const {data,error}=await client.functions.invoke('management-portal-handoff',{body:{action:'selector'}});if(error||data?.error)throw new Error(data?.error||error?.message||'Unable to load authorized portals.');const portals=data?.portals||[];grid.innerHTML='';if(!portals.length){grid.innerHTML='<div class="empty">This staff account does not currently have access to any management portal.</div>';return}for(const p of portals){const card=document.createElement('article');card.className='card';card.innerHTML='<div class="code"></div><h2></h2><p></p><button type="button">Enter Portal</button>';card.querySelector('.code').textContent=p.portal_code;card.querySelector('h2').textContent=p.portal_name;card.querySelector('p').textContent=p.description||'Authorized management portal';const btn=card.querySelector('button');btn.onclick=async()=>{try{btn.disabled=true;btn.textContent='Opening…';msg('Creating secure portal handoff…');const r=await client.functions.invoke('management-portal-handoff',{body:{action:'create',portal_code:p.portal_code,next_path:p.landing_path}});if(r.error||r.data?.error)throw new Error(r.data?.error||r.error?.message||'Unable to create portal handoff.');location.assign(r.data.redirect_url)}catch(e){msg(e?.message||String(e),true);btn.disabled=false;btn.textContent='Enter Portal'}};grid.appendChild(card)}}catch(e){grid.innerHTML='<div class="empty">Unable to load management portal access.</div>';msg(e?.message||String(e),true)}})();
document.getElementById('signout').onclick=async()=>{try{const c=window.getScreenings4uSupabase?window.getScreenings4uSupabase():window.supabaseClient;await c.auth.signOut()}finally{location.replace('admin-login.html')}};
</script></body></html>
