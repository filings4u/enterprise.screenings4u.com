<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#24467f">
  <title>screenings4u Form</title>
  <link rel="icon" href="images/fav.png">
  <style>
    :root{--blue:#173d78;--blue2:#24467f;--orange:#ff6b00;--ink:#172033;--muted:#65758b;--line:#dbe3ec;--soft:#f5f7fa;--white:#fff;--danger:#b42318;--success:#137a4d}
    *{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--soft);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:30px 18px 70px}.brand{display:inline-flex;align-items:center;margin-bottom:24px;text-decoration:none}.brand img{display:block;width:220px;max-width:70vw;height:auto}.hero{background:white;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 14px 40px rgba(15,23,42,.07);margin-bottom:18px}.eyebrow{font-size:11px;letter-spacing:.08em;font-weight:900;color:var(--orange);text-transform:uppercase}.hero h1{color:var(--blue);margin:7px 0 8px;font-size:32px}.hero p{color:var(--muted);line-height:1.6}.notice{padding:14px 16px;background:#fff7ef;border-left:4px solid var(--orange);border-radius:10px;font-size:13px;color:#6b471f;margin-top:14px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 12px 32px rgba(15,23,42,.06)}.section{margin-top:26px;padding-top:24px;border-top:1px solid var(--line)}.section:first-of-type{margin-top:0;padding-top:0;border-top:0}.section h2{font-size:19px;color:var(--blue);margin:0 0 5px}.section .sub{margin:0 0 17px;font-size:13px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field.full{grid-column:1/-1}.field.third{grid-column:span 1}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:800;color:#42526a}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink);font:inherit}textarea{min-height:110px;resize:vertical}.check-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.choice{display:flex;align-items:flex-start;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fbfcfe;font-size:13px}.choice input{width:auto;margin-top:2px}.same-row{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:13px;font-weight:800;color:#42526a}.same-row input{width:auto}.help{font-size:12px;color:var(--muted)}.warning{font-size:12px;color:var(--danger);font-weight:800}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:26px}.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:900;cursor:pointer}.primary{background:var(--orange);color:#fff}.secondary{background:#fff;color:var(--blue);border:1px solid var(--line)}.msg{font-size:13px;font-weight:700}.error{color:var(--danger)}.success{color:var(--success)}.loading{text-align:center;padding:50px;color:var(--muted)}.preview-note{padding:12px 14px;border-radius:10px;background:#eaf2ff;color:#24467f;font-size:13px;font-weight:700;margin-bottom:16px}.hidden{display:none!important}
    @media(max-width:760px){.grid,.check-list{grid-template-columns:1fr}.field.full{grid-column:auto}.hero h1{font-size:27px}.hero,.card{padding:20px}.brand img{width:185px}}
  </style>
  <link href="assets/css/form-security.css?v=20260918-1" rel="stylesheet">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script>
  <script src="assets/js/form-security.js?v=20260918-1" defer></script>
</head>
<body><div class="wrap"><a class="brand" href="index.html" aria-label="screenings4u home"><img id="brandLogo" src="images/logo.png" alt="screenings4u"></a><div id="root"><div class="loading">Loading form…</div></div></div>
<script>
(()=>{'use strict';
const API_BASE='https://elpbnytpciqnbexiaebp.supabase.co/functions/v1';
const params=new URLSearchParams(location.search),slug=params.get('slug')||'',preview=params.get('preview')==='local';
const root=document.getElementById('root');let def=null,started=Date.now();
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const PO_BOX_RE=/\bP(?:OST)?\.?\s*O(?:FFICE)?\.?\s*BOX\b|\bP\.?\s*O\.?\s*BOX\b|\bPOBOX\b/i;
function cssBrand(f){const b=f.branding||{};document.documentElement.style.setProperty('--blue',b.primary_color||'#173d78');document.documentElement.style.setProperty('--blue2',b.secondary_color||'#24467f');document.documentElement.style.setProperty('--orange',b.accent_color||'#ff6b00');document.documentElement.style.setProperty('--soft',b.background_color||'#f5f7fa');document.querySelector('meta[name="theme-color"]').content=b.secondary_color||b.primary_color||'#24467f';document.getElementById('brandLogo').src=b.logo_url||'images/logo.png';document.title=(f.title||f.name||'Form')+' | screenings4u'}
function fieldHtml(f){const req=f.required?' required':'',ph=f.placeholder?` placeholder="${esc(f.placeholder)}"`:'',ml=f.maxlength?` maxlength="${Number(f.maxlength)}"`:'',pat=f.pattern?` pattern="${esc(f.pattern)}"`:'',name=esc(f.name),label=`<label>${esc(f.label)}${f.required?' *':''}</label>`;let control='';
 if(f.type==='textarea')control=`<textarea name="${name}"${req}${ph}${ml}>${esc(f.default_value||'')}</textarea>`;
 else if(f.type==='select')control=`<select name="${name}"${req}><option value="">Select…</option>${(f.options||[]).map(o=>`<option value="${esc(o.value??o.label)}">${esc(o.label??o.value)}</option>`).join('')}</select>`;
 else if(f.type==='radio')control=`<div class="check-list">${(f.options||[]).map(o=>`<label class="choice"><input type="radio" name="${name}" value="${esc(o.value??o.label)}"${req}> ${esc(o.label??o.value)}</label>`).join('')}</div>`;
 else if(f.type==='checkbox_group')control=`<div class="check-list">${(f.options||[]).map(o=>`<label class="choice"><input type="checkbox" name="${name}" value="${esc(o.value??o.label)}"> ${esc(o.label??o.value)}</label>`).join('')}</div>`;
 else if(f.type==='checkbox')control=`<label class="choice"><input type="checkbox" name="${name}" value="true"> ${esc(f.help||f.label)}</label>`;
 else if(f.type==='file')control=`<input type="file" name="${name}" ${f.accept?`accept="${esc(f.accept)}"`:''} ${f.multiple?'multiple':''}${req}>`;
 else control=`<input type="${esc(f.type||'text')}" name="${name}" value="${esc(f.default_value||'')}"${req}${ph}${ml}${pat}${f.min!=null?` min="${esc(f.min)}"`:''}${f.max!=null?` max="${esc(f.max)}"`:''}${f.no_po_box?' data-no-po-box':''}>`;
 const help=f.type==='checkbox'?'':(f.help?`<div class="help ${f.no_po_box?'warning':''}">${esc(f.help)}</div>`:'');return `<div class="field ${f.width==='full'?'full':''}">${f.type==='checkbox'?'':label}${control}${help}</div>`}
function render(f){def=f;cssBrand(f);const settings=f.settings||{};root.innerHTML=`<div class="hero"><div class="eyebrow">${esc(f.eyebrow||'screenings4u')}</div><h1>${esc(f.title)}</h1><p>${esc(f.description||'')}</p>${settings.notice_html?`<div class="notice">${settings.notice_html}</div>`:''}</div><form class="card" id="publicForm" data-s4u-protected="true" data-s4u-form-key="${esc(f.form_key)}"><div aria-hidden="true" style="position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden"><label>Website</label><input name="websiteTrap" type="text" tabindex="-1" autocomplete="off"></div>${preview?'<div class="preview-note">Preview mode — submissions are disabled.</div>':''}${(f.sections||[]).map((s,si)=>`<div class="section" data-section-id="${esc(s.id||'section-'+si)}"><h2>${esc(s.title)}</h2>${s.description?`<p class="sub">${esc(s.description)}</p>`:''}${s.copy_label?`<label class="same-row"><input type="checkbox" data-copy-section="${si}"> ${esc(s.copy_label)}</label>`:''}<div class="grid">${(s.fields||[]).map(fieldHtml).join('')}</div></div>`).join('')}<div class="actions"><button class="btn primary" id="submitBtn" type="submit" ${preview?'disabled':''}>${preview?'Preview Only':esc(settings.submit_label||'Submit Form')}</button><span class="msg" id="msg"></span></div></form>`;wire()}
function wire(){const form=document.getElementById('publicForm'),msg=document.getElementById('msg'),submit=document.getElementById('submitBtn');
 form.querySelectorAll('[data-copy-section]').forEach(box=>box.addEventListener('change',()=>{const sec=def.sections[Number(box.dataset.copySection)];for(const f of sec.fields||[]){if(!f.copy_from)continue;const src=form.elements[f.copy_from],dst=form.elements[f.name];if(src&&dst){dst.value=box.checked?src.value:dst.value;dst.readOnly=box.checked}}}));
 form.querySelectorAll('[data-no-po-box]').forEach(input=>input.addEventListener('input',()=>input.setCustomValidity(PO_BOX_RE.test(input.value)?'P.O. Boxes are not allowed. Enter a physical street address.':'')));
 form.addEventListener('submit',async e=>{e.preventDefault();if(preview)return;if(!form.reportValidity())return;for(const i of form.querySelectorAll('[data-no-po-box]')){i.setCustomValidity(PO_BOX_RE.test(i.value)?'P.O. Boxes are not allowed. Enter a physical street address.':'');if(!i.checkValidity()){i.reportValidity();return}}
 submit.disabled=true;msg.textContent='Submitting…';msg.className='msg';try{const payload={},files=[];for(const [k,v] of new FormData(form).entries()){if(k==='websiteTrap')continue;if(v instanceof File){if(v.size)files.push({fieldName:k,file:v});continue}if(payload[k]!==undefined){payload[k]=Array.isArray(payload[k])?[...payload[k],v]:[payload[k],v]}else payload[k]=v}for(const cb of form.querySelectorAll('input[type="checkbox"]')){if(cb.dataset.copySection!==undefined)continue;if(cb.name&&!payload[cb.name]&&cb.type==='checkbox')payload[cb.name]=cb.checked?cb.value||true:false}
 let security={};try{security=window.Screenings4uFormSecurity?.payload(form)||{}}catch(err){}
 const r=await fetch(API_BASE+'/public-form-submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({formKey:def.form_key,slug:def.slug,turnstileToken:security.turnstileToken||'',formStartedAt:security.formStartedAt||started,websiteTrap:security.websiteTrap||form.elements.websiteTrap?.value||'',sourceUrl:location.href,payload})});const data=await r.json().catch(()=>({}));if(!r.ok||data.error)throw new Error(data.error||'Unable to submit this form.');
 for(const item of files){const fd=new FormData();fd.append('submissionId',data.submissionId);fd.append('fieldName',item.fieldName);fd.append('file',item.file);const ur=await fetch(API_BASE+'/public-form-file-upload',{method:'POST',body:fd});const ud=await ur.json().catch(()=>({}));if(!ur.ok||ud.error)throw new Error(ud.error||`Unable to upload ${item.file.name}.`)}
 msg.textContent=data.successMessage||def.success_message||'Thank you. Your form has been submitted.';msg.className='msg success';form.reset();try{window.Screenings4uFormSecurity?.reset(form)}catch{}if(def.settings?.success_redirect_url){const a=document.createElement('a');a.className='btn secondary';a.href=def.settings.success_redirect_url;a.textContent='Continue';msg.parentElement.appendChild(a)}
 }catch(err){msg.textContent=err?.message||'Unable to submit this form.';msg.className='msg error'}finally{submit.disabled=false}})}
async function init(){try{let f;if(preview){f=JSON.parse(sessionStorage.getItem('s4u_form_preview')||'null');if(!f)throw new Error('Preview data is unavailable. Return to Forms Management and open the preview again.');f.form_key=f.form_key||'preview';f.slug=f.slug||'preview'}else{if(!slug)throw new Error('No form was specified.');const r=await fetch(API_BASE+'/public-form-definition?slug='+encodeURIComponent(slug));const d=await r.json().catch(()=>({}));if(!r.ok||d.error)throw new Error(d.error||'This form is unavailable.');f=d.form}render(f)}catch(err){root.innerHTML=`<div class="hero"><h1>Form unavailable</h1><p>${esc(err?.message||'Unable to load this form.')}</p></div>`}}
init();
})();
</script></body></html>
